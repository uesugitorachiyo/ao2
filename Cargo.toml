[workspace]
members = [
  "crates/ao2-core",
  "crates/ao2-artifacts",
  "crates/ao2-adapter-codex",
  "crates/ao2-adapter-claude",
  "crates/ao2-adapters",
  "crates/ao2-policy",
  "crates/ao2-runtime",
  "crates/ao2-cli",
  "crates/sdd-planner"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.83.0"
license = "Apache-2.0"
version = "0.5.11"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.5.53", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
toml = "0.8"
flate2 = "1"
globset = "=0.4.16"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
signature = "2"
tar = "0.4"
thiserror = "2"
ulid = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
tempfile = "3"
tiktoken-rs = "0.7"
sdd-planner = { path = "crates/sdd-planner" }

# Workspace-wide lint policy. Crates opt in with `[lints] workspace = true`.
# `unsafe_code = "forbid"` makes the no-unsafe posture a hard compile error
# rather than a convention — these crates produce and verify governance
# artifacts and have no need for unsafe. (Not every member opts in yet; the
# opt-in is being rolled out crate by crate.)
[workspace.lints.rust]
unsafe_code = "forbid"
