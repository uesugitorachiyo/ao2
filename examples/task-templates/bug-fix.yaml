id: bug-fix
version: 0.1.0
template_kind: real_project
objective: Fix a failing production bug with the smallest safe code change and a regression test.
roles:
  - planner
  - implementer
  - reviewer
  - test-engineer
  - evaluator-closer
verifier:
  command: python -m pytest
policy:
  deny_by_default: true
  approval_mode: exact_action_digest
  risky_actions:
    - git_push
    - destructive_delete
    - package_install
    - network_egress
    - secret_read
evidence:
  evidence_cockpit: required
  replay: required
  required_artifacts:
    - plan
    - patch_summary
    - test_log
    - closure_report
acceptance:
  - The root cause is identified in the evidence pack.
  - The patch is scoped to the bug and avoids unrelated refactors.
  - A regression test fails before the fix and passes after the fix.
  - Replay has zero digest failures.
