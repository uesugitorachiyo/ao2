id: dependency-upgrade
version: 0.1.0
template_kind: real_project
objective: Upgrade one dependency with compatibility checks, focused tests, and rollback evidence.
roles:
  - planner
  - implementer
  - reviewer
  - test-engineer
  - evaluator-closer
verifier:
  command: python -m pytest
policy:
  deny_by_default: true
  approval_mode: exact_action_digest
  risky_actions:
    - git_push
    - destructive_delete
    - package_install
    - network_egress
    - secret_read
evidence:
  evidence_cockpit: required
  replay: required
  required_artifacts:
    - plan
    - patch_summary
    - test_log
    - closure_report
acceptance:
  - Only the intended dependency and required lockfile entries change.
  - Compatibility risks are documented in the evidence pack.
  - Tests cover the integration surface touched by the upgrade.
  - Replay has zero digest failures.
