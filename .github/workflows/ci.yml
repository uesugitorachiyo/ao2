name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  rust-architecture:
    name: Rust architecture guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run architecture guard
        run: python3 scripts/check-rust-architecture.py

  verify:
    name: Verify ${{ matrix.os }} / ${{ matrix.phase }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            phase: fmt
            timeout_minutes: 10
            command: cargo fmt --all -- --check
          - os: ubuntu-latest
            phase: python-guard-tests
            timeout_minutes: 5
            # Equivalent focused command:
            # PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_compatibility_vectors.py tests/test_public_stabilization.py tests/test_phase1_promote_wrapper.py tests/test_ao2_native_runtime_platform_evidence.py tests/test_ao2_rsi_claim_readiness.py tests/test_ao2_rsi_governed_self_change_dry_run.py tests/test_ao2_rsi_live_self_change_rehearsal.py tests/test_windows_outbound_worker.py -q
            # Expanded RSI readback-index command:
            # PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_ao2_rsi_live_self_change_readback_index.py tests/test_compatibility_vectors.py tests/test_public_stabilization.py tests/test_phase1_promote_wrapper.py tests/test_release_publish_approved_assets.py tests/test_ao2_native_runtime_platform_evidence.py tests/test_ao2_rsi_claim_readiness.py tests/test_ao2_rsi_governed_self_change_dry_run.py tests/test_ao2_rsi_live_self_change_rehearsal.py tests/test_windows_outbound_worker.py tests/test_validate_github_draft_pr_readback.py -q
            # Task-board full-loop selector:
            # PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/test_public_stabilization.py::test_pulse_task_board_full_loop_generate_execute_validate_regenerate -q
            command: python3 -m pip install pytest && scripts/ci-python-guard-artifacts.sh
          - os: ubuntu-latest
            phase: test-workspace-non-cli
            timeout_minutes: 30
            command: cargo test --workspace --exclude ao2-cli
          - os: ubuntu-latest
            phase: test-cli-approval-core
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_adapter
              cargo test -p ao2-cli --test cli_core
              cargo test -p ao2-cli --test cli_report_cockpit
              cargo test -p ao2-cli --test cli_contract
              cargo test -p ao2-cli --test cli_evidence
              cargo test -p ao2-cli --test cli_git
              cargo test -p ao2-cli --test cli_provider_run_repair
              cargo test -p ao2-cli --test cli_memory
          - os: ubuntu-latest
            phase: test-cli-approval-control-plane
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_control_plane
          - os: ubuntu-latest
            phase: test-cli-approval-factory-plan
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_factory_plan
          - os: ubuntu-latest
            phase: test-cli-approval-factory-queue
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_factory_queue_core
              cargo test -p ao2-cli --test cli_factory_queue
          - os: ubuntu-latest
            phase: test-cli-approval-factory-project
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_factory_project
          - os: ubuntu-latest
            phase: test-cli-approval-factory-other
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_factory_pack
              cargo test -p ao2-cli --test cli_factory_verify
              cargo test -p ao2-cli --test cli_factory_run
              cargo test -p ao2-cli --test cli_factory_evaluator_closer
              cargo test -p ao2-cli --test cli_factory_greenfield_spec_ingest
              cargo test -p ao2-cli --test cli_greenfield_three_os
              cargo test -p ao2-cli --test cli_factory_governed
              cargo test -p ao2-cli --test cli_factory_replacement
          - os: ubuntu-latest
            phase: test-cli-approval-plugin
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_plugin_pulse
              cargo test -p ao2-cli --test cli_plugin_package
              cargo test -p ao2-cli --test cli_plugin_consumer_lifecycle
              cargo test -p ao2-cli --test cli_plugin_release_candidate
              cargo test -p ao2-cli --test cli_plugin_distribution
              cargo test -p ao2-cli --test cli_plugin_adapter
              cargo test -p ao2-cli --test cli_plugin_wrapper_harness
          - os: ubuntu-latest
            phase: test-cli-approval-pulse-provider-release
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_pulse
              cargo test -p ao2-cli --test cli_provider
              cargo test -p ao2-cli --test cli_release_install
              cargo test -p ao2-cli --test cli_release_phase1
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-core
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_workbench_api
              cargo test -p ao2-cli --test cli_workbench_evidence
              cargo test -p ao2-cli --test cli_workbench_export
              cargo test -p ao2-cli --test cli_workbench_factory
              cargo test -p ao2-cli --test cli_workbench_greenfield
              cargo test -p ao2-cli --test cli_workbench_launch
              cargo test -p ao2-cli --test cli_workbench_lists
              cargo test -p ao2-cli --test cli_workbench_memory
              cargo test -p ao2-cli --test cli_workbench_obligation
              cargo test -p ao2-cli --test cli_workbench_operator
              cargo test -p ao2-cli --test cli_workbench_serve
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-project
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_workbench_project_start
              cargo test -p ao2-cli --test cli_workbench_project_start_recovery
              cargo test -p ao2-cli --test cli_workbench_project_start_claim
              cargo test -p ao2-cli --test cli_workbench_project_start_post_continuation
              cargo test -p ao2-cli --test cli_workbench_project_start_release
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-provider
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_workbench_provider
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-queue
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_workbench_queue -- --test-threads=1
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-release-run-support
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_workbench_release
              cargo test -p ao2-cli --test cli_workbench_run_evidence
              cargo test -p ao2-cli --test cli_workbench_support
          - os: ubuntu-latest
            phase: test-cli-contract-support
            timeout_minutes: 15
            command: >-
              cargo test -p ao2-cli
              --test contract_gate_support_signing
              --test contract_obligation_gate_signing_survey
              --test contract_verify_obligation_gate_signing
          - os: ubuntu-latest
