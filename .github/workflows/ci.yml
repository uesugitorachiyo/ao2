          assert summary["rsi_cross_repo_e2e"]["claim_publish_decision"] == "deny", summary
          assert summary["rsi_cross_repo_e2e"]["claim_publish_authority"] is False, summary
          assert summary["rsi_cross_repo_e2e"]["covenant_gate_schema_version"] == "covenant.rsi-claim-publish-gate.v1", summary
          assert summary["control_plane_release_readiness_dashboard_readback"]["schema_version"] == "ao2.rsi-control-plane-release-readiness-dashboard-smoke.v1", summary
          assert summary["control_plane_release_readiness_dashboard_readback"]["status"] == "passed", summary
