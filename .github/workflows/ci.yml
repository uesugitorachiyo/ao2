              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_accepts_relocated
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_default_on
          - os: ubuntu-latest
            phase: test-cli-release-gate-signing-verified
            timeout_minutes: 15
            command: |
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_accepts_verified
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_accepts_windows
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_can_verify_hosted
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_provenance
          - os: ubuntu-latest
            phase: test-cli-release-gate-signing-rejections
            timeout_minutes: 15
            command: |
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_fails
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_requires
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_allow_unsigned
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_legacy
          - os: ubuntu-latest
            phase: test-cli-release-support
            timeout_minutes: 15
            command: >-
              cargo test -p ao2-cli
              --test cp_release_snapshot
              --test release_evaluator_decision
              --test release_handoff_checklist
              --test release_support_bundle_verification
          - os: ubuntu-latest
            phase: test-cli-release-packaging
            timeout_minutes: 20
            command: |
              npm run test:archive-resources
              cargo test -p ao2-cli --test release_packaging -- --test-threads=1
          - os: ubuntu-latest
            phase: test-cli-factory-bridge
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test factory_bridge
          - os: ubuntu-latest
            phase: test-cli-factory-cancel
            timeout_minutes: 15
            command: >-
              cargo test -p ao2-cli
