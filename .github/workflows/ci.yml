            timeout_minutes: 20
            command: cargo build --release -p ao2-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Go for SDD real-project checks
        if: contains(matrix.phase, 'sdd')
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'

      - name: Run ${{ matrix.phase }}
        shell: bash
        run: |
          scripts/ci-cargo-retry.sh "${{ matrix.phase }}" <<'AO2_CI_COMMAND'
          ${{ matrix.command }}
          AO2_CI_COMMAND

      - name: Upload Python guard artifacts
        if: matrix.phase == 'python-guard-tests'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-python-guard-${{ matrix.os }}
          path: target/ci-artifacts/python-guard-tests
          if-no-files-found: error

      - name: Upload ao2 binary
        if: matrix.phase == 'build-release'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-${{ matrix.os }}
          path: |
            target/release/ao2
            target/release/ao2.exe
          if-no-files-found: ignore

  non_approval_required_check_compat:
    name: Verify ${{ matrix.os }} / test-cli-non-approval
    runs-on: ${{ matrix.os }}
    needs: verify
    if: ${{ always() }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Report legacy required check compatibility
        shell: bash
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "Split non-approval shards did not pass: ${{ needs.verify.result }}"
            exit 1
          fi
          echo "Split non-approval shards passed; reporting legacy required check name."

  release-archive-hosted-smoke:
    name: Release archive hosted smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p ao2-cli

      - name: Run Unix hosted release archive smoke
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          AO2_RELEASE_HOSTED_SMOKE_ROOT: target/release-archive-hosted-smoke/${{ matrix.os }}
          AO2_RELEASE_HOSTED_SMOKE_JSON: target/release-archive-hosted-smoke/${{ matrix.os }}/summary.json
        run: scripts/release-archive-hosted-smoke.sh

      - name: Run Windows hosted release archive smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          AO2_RELEASE_HOSTED_SMOKE_ROOT: target/release-archive-hosted-smoke/${{ matrix.os }}
          AO2_RELEASE_HOSTED_SMOKE_JSON: target/release-archive-hosted-smoke/${{ matrix.os }}/summary.json
        run: ./scripts/release-archive-hosted-smoke.ps1

      - name: Upload hosted release archive smoke artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-archive-hosted-smoke-${{ matrix.os }}
          path: target/release-archive-hosted-smoke
          if-no-files-found: error

  workbench-operator-packet-control-plane-smoke:
    name: Workbench operator packet control-plane smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout AO2
        uses: actions/checkout@v6.0.3
        with:
          path: ao2

      - name: Checkout control plane
        uses: actions/checkout@v6.0.3
        with:
          repository: uesugitorachiyo/ao2-control-plane
          path: ao2-control-plane

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Run Workbench operator packet smoke
        working-directory: ao2
        env:
          AO2_CONTROL_PLANE_ROOT: ../ao2-control-plane
          AO2_WORKBENCH_OPERATOR_PACKET_CP_PROFILE: debug
        run: npm run smoke:workbench-operator-packet-control-plane

      - name: Upload Workbench operator packet smoke artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-workbench-operator-packet-control-plane-smoke-${{ matrix.os }}
          path: ao2/target/workbench-operator-packet-control-plane-smoke
          if-no-files-found: error

  workbench-operator-packet-control-plane-smoke-index:
    name: Workbench operator packet control-plane smoke index
    runs-on: ubuntu-latest
    needs: workbench-operator-packet-control-plane-smoke
    timeout-minutes: 10
    steps:
      - name: Checkout AO2
        uses: actions/checkout@v6.0.3
        with:
          path: ao2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Download Workbench operator packet smoke artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ao2-workbench-operator-packet-control-plane-smoke-*
          path: ao2/target/workbench-operator-packet-control-plane-smoke-ci-artifacts

      - name: Verify Workbench operator packet smoke index
        working-directory: ao2
        env:
          AO2_WORKBENCH_OPERATOR_PACKET_CP_INDEX_REQUIRED_OS: ubuntu-latest,macos-latest,windows-latest
        run: npm run smoke:workbench-operator-packet-control-plane:index

      - name: Upload Workbench operator packet smoke index
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-workbench-operator-packet-control-plane-smoke-index
          path: ao2/target/workbench-operator-packet-control-plane-smoke-index
          if-no-files-found: error

  release-readiness-artifacts:
    name: Release readiness artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run static release readiness
        shell: bash
        run: |
          AO2_RELEASE_READINESS_ROOT=target/release-readiness-ci \
            scripts/release-readiness.sh --static-only
      - name: Upload release-readiness artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-readiness
          path: target/release-readiness-ci
          if-no-files-found: error

  release-readiness-hosted-artifact-gate:
    name: Release readiness hosted artifact gate
    runs-on: ubuntu-latest
    needs: release-readiness-artifacts
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Download current release-readiness artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-release-readiness
          path: target/release-readiness-hosted-artifact-gate/input/ao2-release-readiness
      - name: Verify current release-readiness hosted artifact gate
        shell: bash
        run: |
          AO2_RELEASE_READINESS_REGRESSION_ROOT=target/release-readiness-hosted-artifact-gate/report \
          AO2_RELEASE_READINESS_REGRESSION_ONLY_HOSTED_ARTIFACT_GATE=1 \
          AO2_RELEASE_READINESS_REGRESSION_HOSTED_ARTIFACT_REQUIRED=1 \
          AO2_RELEASE_READINESS_REGRESSION_HOSTED_ARTIFACT_FIXTURE_DIR=target/release-readiness-hosted-artifact-gate/input/ao2-release-readiness \
            npm run release:readiness:regression-gate
      - name: Upload release-readiness hosted artifact gate
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ao2-release-readiness-hosted-artifact-gate
          path: target/release-readiness-hosted-artifact-gate/report
          if-no-files-found: error

  operator-release-evidence-workflow-contract:
    name: Operator release evidence workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Verify operator release evidence workflow contract
        run: npm run release:operator-evidence-workflow-contract

  stable-release-evidence-packet-artifacts:
    name: Stable release evidence packet artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - rsi-cross-repo-e2e-artifacts
      - dual-repo-release-publication-closure-index
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Run stable promotion evidence baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AO2_STABLE_PROMOTION_ROOT=target/stable-release-evidence-packet-ci/stable-promotion-workflow \
          AO2_STABLE_PROMOTION_CLOSURE_INDEX_RUN_ID=${{ github.run_id }} \
            npm run release:stable-promotion-workflow
      - name: Run operator release evidence bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AO2_OPERATOR_RELEASE_EVIDENCE_ROOT=target/stable-release-evidence-packet-ci/operator-release-evidence-bundle \
          AO2_OPERATOR_RELEASE_CLOSURE_INDEX_RUN_ID=${{ github.run_id }} \
            npm run release:operator-evidence-bundle
      - name: Download RSI cross-repo E2E artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-rsi-cross-repo-e2e
          path: target/stable-release-evidence-packet-ci/rsi-cross-repo-e2e
      - name: Download RSI eligibility packet artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-rsi-eligibility-packet
          path: target/stable-release-evidence-packet-ci/rsi-eligibility-packet
      - name: Compose stable release evidence packet
        shell: bash
        run: |
          AO2_STABLE_RELEASE_EVIDENCE_PACKET_ROOT=target/stable-release-evidence-packet-ci/packet \
          AO2_STABLE_RELEASE_EVIDENCE_PACKET_STABLE_SUMMARY=target/stable-release-evidence-packet-ci/stable-promotion-workflow/summary.json \
          AO2_STABLE_RELEASE_EVIDENCE_PACKET_OPERATOR_SUMMARY=target/stable-release-evidence-packet-ci/operator-release-evidence-bundle/summary.json \
          AO2_STABLE_RELEASE_EVIDENCE_PACKET_RSI_SUMMARY=target/stable-release-evidence-packet-ci/rsi-cross-repo-e2e/latest/summary.json \
          AO2_STABLE_RELEASE_EVIDENCE_PACKET_RSI_ELIGIBILITY_SUMMARY=target/stable-release-evidence-packet-ci/rsi-eligibility-packet/packet/summary.json \
            npm run release:stable-evidence-packet
      - name: Verify stable release evidence packet
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/stable-release-evidence-packet-ci")
          summary = json.loads((root / "packet" / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "ao2.stable-release-evidence-packet.v1", summary
          assert summary["status"] == "passed", summary
          assert summary["stable_release_evidence_ready"] is True, summary
          assert summary["rsi_cross_repo_e2e"]["schema_version"] == "ao2.rsi-cross-repo-e2e.v1", summary
          assert summary["rsi_cross_repo_e2e"]["claim_publish_decision"] == "deny", summary
          assert summary["rsi_cross_repo_e2e"]["claim_publish_authority"] is False, summary
          assert summary["rsi_cross_repo_e2e"]["covenant_gate_schema_version"] == "covenant.rsi-claim-publish-gate.v1", summary
          assert summary["rsi_blueprint_authorization"]["schema_version"] == "ao2.rsi-blueprint-authorization-gate.v1", summary
          assert summary["rsi_blueprint_authorization"]["status"] == "passed", summary
          assert summary["rsi_blueprint_authorization"]["blueprint_authorization_ready"] is True, summary
          assert summary["rsi_blueprint_authorization"]["gate_model"] == "tiered", summary
          assert summary["rsi_blueprint_authorization"]["source"] == "ao-blueprint", summary
          assert summary["rsi_blueprint_authorization"]["self_authorized_by_rsi"] is False, summary
          assert summary["rsi_blueprint_authorization"]["authorizes_claim_publication"] is False, summary
          assert summary["rsi_blueprint_authorization"]["authorizes_ao_blueprint_self_change"] is False, summary
          assert summary["rsi_improvement_evidence"]["schema_version"] == "ao2.rsi-improvement-evidence-gate.v1", summary
          assert summary["rsi_improvement_evidence"]["status"] == "passed", summary
          assert summary["rsi_improvement_evidence"]["improvement_ready"] is True, summary
          assert summary["rsi_improvement_evidence"]["measured_improvement_percent"] >= 5, summary
          assert summary["rsi_improvement_evidence"]["claim_publish_decision"] == "deny", summary
          assert summary["rsi_improvement_evidence"]["claim_publish_authority"] is False, summary
          assert summary["rsi_improvement_trend"]["schema_version"] == "ao2.rsi-improvement-trend.v1", summary
          assert summary["rsi_improvement_trend"]["status"] == "passed", summary
          assert summary["rsi_improvement_trend"]["trend_ready"] is True, summary
          assert summary["rsi_improvement_trend"]["current_measured_improvement_percent"] >= 5, summary
          assert "delta_from_previous_percent" in summary["rsi_improvement_trend"], summary
          assert summary["rsi_improvement_trend"]["claim_publish_decision"] == "deny", summary
          assert summary["rsi_improvement_trend"]["claim_publish_authority"] is False, summary
          assert summary["rsi_eligibility_packet"]["schema_version"] == "ao2.rsi-eligibility-packet.v1", summary
          assert summary["rsi_eligibility_packet"]["status"] == "passed", summary
          assert summary["rsi_eligibility_packet"]["rsi_eligibility_ready"] is True, summary
          assert summary["rsi_eligibility_packet"]["claim_publish_decision"] == "deny", summary
          assert summary["rsi_eligibility_packet"]["claim_publish_authority"] is False, summary
          assert summary["trust_boundary"]["mutates_releases"] is False, summary
          assert summary["trust_boundary"]["stores_credentials"] is False, summary
          assert (root / "stable-promotion-workflow" / "summary.json").is_file()
          assert (root / "operator-release-evidence-bundle" / "summary.json").is_file()
          assert (root / "rsi-cross-repo-e2e" / "latest" / "summary.json").is_file()
          assert (root / "rsi-eligibility-packet" / "packet" / "summary.json").is_file()
          assert (root / "packet" / "dashboard.html").is_file()
          PY
      - name: Upload stable release evidence packet
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-stable-release-evidence-packet
          path: target/stable-release-evidence-packet-ci
          if-no-files-found: error

  release-publication-closure-artifacts:
    name: Release publication closure artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Verify canonical hosted public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publication_root="target/canonical-hosted-public-release"
          report="target/canonical-hosted-public-release-verification.json"
          version="$(scripts/current-version.sh)"
          tag="v$version"
          mkdir -p "$publication_root"
          gh release download "$tag" \
            --repo uesugitorachiyo/ao2 \
            --pattern "ao2-$version-linux-x86_64.tar.gz" \
            --pattern "ao2-$version-macos-aarch64.tar.gz" \
            --pattern "ao2-$version-windows-x86_64.tar.gz" \
            --pattern promotion-plan.json \
            --pattern SHA256SUMS \
            --dir "$publication_root"
          plan="$publication_root/promotion-plan.json"
          python3 scripts/hosted_release_promotion.py verify-public \
            --publication-root "$publication_root" \
            --source-sha "$(jq -r '.source_sha' "$plan")" \
            --version "$version" \
            --tag "$tag" \
            --manifest-sha256 "$(jq -r '.approved_asset_manifest_sha256' "$plan")" \
            --plan-sha256 "$(sha256sum "$plan" | awk '{print $1}')" \
            --physical-evidence-sha256 "$(jq -r '.physical_windows_evidence_sha256' "$plan")" \
            --out "$report"
      - name: Check legacy provenance-sidecar state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release-publication-provenance
          release_tag="v$(scripts/current-version.sh)"
          if gh release view "$release_tag" --repo uesugitorachiyo/ao2 >/dev/null 2>&1; then
            assets="$(gh release view "$release_tag" --repo uesugitorachiyo/ao2 --json assets --jq '.assets[].name')"
            if grep -Fxq ao2-release-provenance.json <<<"$assets" \
              && grep -Fxq ao2-release-provenance.json.sig <<<"$assets" \
              && grep -Fxq ao2-release-signing-public.pem <<<"$assets"; then
              gh release download "$release_tag" \
                --repo uesugitorachiyo/ao2 \
                --pattern ao2-release-provenance.json \
                --pattern ao2-release-provenance.json.sig \
                --pattern ao2-release-signing-public.pem \
                --dir target/release-publication-provenance \
                --clobber
            else
              echo "release $release_tag provenance sidecars not found; CI-safe dry-run closure will record the candidate release gap"
            fi
          else
            echo "release $release_tag not found; CI-safe dry-run closure will record the candidate release gap"
          fi
      - name: Run release publication dry-run closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AO2_RELEASE_ASSET_PUBLICATION_READINESS_CI_SAFE=1 \
          AO2_RELEASE_SYNC_ALLOW_MISSING_RELEASE=1 \
          AO2_RELEASE_PROVENANCE_DIR=target/release-publication-provenance \
          AO2_RELEASE_CANONICAL_HOSTED_SUMMARY=target/canonical-hosted-public-release-verification.json \
          AO2_RELEASE_PUBLICATION_DRY_RUN_CLOSURE_ROOT=target/release-publication-closure-ci \
            npm run release:publication-dry-run-closure
      - name: Verify release publication closure evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/release-publication-closure-ci")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "ao2.release-publication-dry-run-closure.v1", summary
          assert summary["status"] == "passed", summary
          assert summary["publication_ready"] is True, summary
          assert summary["publication_model"] == "canonical_hosted_five_asset", summary
          assert summary["stable_release_ready"] is True, summary
          assert summary["canonical_hosted_release_verification"]["status"] == "passed", summary
          assert summary["blockers"] == [], summary
          assert summary["publication_state"]["dry_run"] is True, summary
          assert summary["publication_state"]["upload_status"] == "not_attempted", summary
          assert summary["publication_state"]["release_publish"] == "not executed", summary
          assert summary["trust_boundary"]["mutates_releases"] is False, summary
          assert summary["trust_boundary"]["stores_credentials"] is False, summary
          PY
          test -f target/release-publication-closure-ci/summary.json
          test -f target/release-publication-closure-ci/release-asset-publication-readiness/summary.json
          test -f target/release-publication-closure-ci/release-sync-provenance-assets/summary.json
          test -f target/release-publication-closure-ci/stable-release-readiness/summary.json
      - name: Upload release publication closure evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-publication-closure
          path: target/release-publication-closure-ci
          if-no-files-found: error

  dual-repo-release-publication-closure-index:
    name: Dual-repo release publication closure index
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: release-publication-closure-artifacts
    timeout-minutes: 10
    steps:
      - name: Checkout release train manifest
        uses: actions/checkout@v6.0.3
      - name: Download AO2 release publication closure artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-release-publication-closure
          path: target/dual-repo-release-publication-closure-index/ao2-release-publication-closure
      - name: Download AO2 public archive assets for closure index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(scripts/release-train-env.sh stable)"
          archive_dir="target/dual-repo-release-publication-closure-index/ao2-release-archives"
          rm -rf "$archive_dir"
          mkdir -p "$archive_dir"
          gh release download "$AO2_RELEASE_TRAIN_AO2_TAG" \
            --repo uesugitorachiyo/ao2 \
            --pattern "ao2-*.tar.gz" \
            --dir "$archive_dir" \
            --clobber
      - name: Download ao2-control-plane release publication closure artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp_artifact_dir="target/dual-repo-release-publication-closure-index/ao2-control-plane-release-publication-closure"
          cp_run_id=""
          for attempt in $(seq 1 30); do
            while IFS= read -r candidate_run_id; do
              [ -n "$candidate_run_id" ] || continue
              rm -rf "$cp_artifact_dir"
              mkdir -p "$cp_artifact_dir"
              if gh run download "$candidate_run_id" --repo uesugitorachiyo/ao2-control-plane \
                --name ao2-control-plane-release-publication-closure \
                --dir "$cp_artifact_dir"; then
                cp_run_id="$candidate_run_id"
                break
              fi
            done < <(gh run list --repo uesugitorachiyo/ao2-control-plane --branch main --workflow CI --status success --limit 10 --json databaseId --jq '.[].databaseId')
            if [ -n "$cp_run_id" ]; then
              break
            fi
            latest_status="$(gh run list --repo uesugitorachiyo/ao2-control-plane --branch main --workflow CI --limit 1 --json status --jq '.[0].status // ""')"
            if [ "$latest_status" != "in_progress" ] && [ "$latest_status" != "queued" ]; then
              break
            fi
            echo "waiting for ao2-control-plane main CI publication closure artifact attempt=$attempt status=$latest_status"
            sleep 20
          done
          if [ -z "$cp_run_id" ]; then
            echo "missing ao2-control-plane release publication closure artifact in recent successful main CI runs" >&2
            exit 1
          fi
          printf '%s\n' "$cp_run_id" > target/dual-repo-release-publication-closure-index/control-plane-run-id.txt
      - name: Validate dual-repo publication closure evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("target/dual-repo-release-publication-closure-index")
          ao2_summary_path = root / "ao2-release-publication-closure" / "summary.json"
          cp_summary_path = root / "ao2-control-plane-release-publication-closure" / "summary.json"
          ao2_archive_dir = root / "ao2-release-archives"
          release_train = json.loads(Path("docs/release/release-train.json").read_text(encoding="utf-8"))
          stable_version = release_train["stable"]["ao2"]["version"]
          ao2_summary = json.loads(ao2_summary_path.read_text(encoding="utf-8"))
          cp_summary = json.loads(cp_summary_path.read_text(encoding="utf-8"))
          assert ao2_summary.get("schema_version") == "ao2.release-publication-dry-run-closure.v1", ao2_summary
          assert ao2_summary.get("status") == "passed", ao2_summary
          assert ao2_summary.get("publication_ready") is True, ao2_summary
          assert ao2_summary.get("stable_release_ready") is True, ao2_summary
          assert ao2_summary.get("trust_boundary", {}).get("mutates_releases") is False, ao2_summary
          assert cp_summary.get("schema_version") == "ao2.cp-release-publication-closure.v1", cp_summary
          assert cp_summary.get("status") == "passed", cp_summary
          assert cp_summary.get("checksum_verified") is True, cp_summary
          assert cp_summary.get("trust_boundary", {}).get("mutates_github_releases") is False, cp_summary
          assert cp_summary.get("trust_boundary", {}).get("mutates_ao_artifacts") is False, cp_summary
          required_ao2_archives = [
              f"ao2-{stable_version}-linux-x86_64.tar.gz",
              f"ao2-{stable_version}-macos-aarch64.tar.gz",
              f"ao2-{stable_version}-windows-x86_64.tar.gz",
          ]
          ao2_archive_assets = []
          for name in required_ao2_archives:
              path = ao2_archive_dir / name
              assert path.is_file(), {"missing_ao2_archive": name, "archive_dir": str(ao2_archive_dir)}
              ao2_archive_assets.append(
                  {
                      "name": name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size_bytes": path.stat().st_size,
                  }
              )
          for asset in ao2_archive_assets:
              assert isinstance(asset["sha256"], str) and len(asset["sha256"]) == 64 and all(
                  char in "0123456789abcdef" for char in asset["sha256"].lower()
              ), asset
              assert isinstance(asset["size_bytes"], int) and asset["size_bytes"] > 0, asset
          cp_assets = cp_summary.get("assets", [])
          cp_asset_records = sorted(
              [
                  {
                      "name": asset["name"],
                      "sha256": asset.get("sha256"),
                      "size_bytes": asset.get("size_bytes"),
                  }
                  for asset in cp_assets
                  if isinstance(asset, dict) and asset.get("name")
              ],
              key=lambda asset: asset["name"],
          )
          cp_archive_assets = [
              asset
              for asset in cp_asset_records
              if asset["name"].startswith("ao2-control-plane-")
              and asset["name"].endswith(".tar.gz")
          ]
          assert cp_archive_assets, cp_summary
          for asset in cp_archive_assets:
              digest = asset.get("sha256")
              size_bytes = asset.get("size_bytes")
              assert isinstance(digest, str) and len(digest) == 64 and all(
                  char in "0123456789abcdef" for char in digest.lower()
              ), asset
              assert isinstance(size_bytes, int) and size_bytes > 0, asset
          summary = {
              "schema_version": "ao2.dual-repo-release-publication-closure-index.v1",
              "status": "passed",
              "source_artifacts": [
                  "ao2-release-publication-closure",
                  "ao2-control-plane-release-publication-closure",
              ],
              "source_summaries": [str(ao2_summary_path), str(cp_summary_path)],
              "ao2": {
                  "schema_version": ao2_summary["schema_version"],
                  "status": ao2_summary["status"],
                  "publication_ready": ao2_summary["publication_ready"],
                  "stable_release_ready": ao2_summary["stable_release_ready"],
                  "asset_count": len(ao2_archive_assets),
                  "assets": ao2_archive_assets,
                  "archive_assets": ao2_archive_assets,
              },
              "control_plane": {
                  "schema_version": cp_summary["schema_version"],
                  "status": cp_summary["status"],
                  "release_tag": cp_summary.get("release_tag"),
                  "checksum_verified": cp_summary["checksum_verified"],
                  "asset_count": len(cp_asset_records),
                  "assets": cp_asset_records,
                  "archive_assets": cp_archive_assets,
              },
              "trust_boundary": {
                  "local_only": True,
                  "stores_credentials": False,
                  "mutates_releases": False,
                  "mutates_github_releases": False,
                  "control_plane_approves_release": False,
                  "source": "github_actions_artifact_download",
              },
          }
          out_path = root / "summary.json"
          out_path.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"summary={out_path}")
          PY
      - name: Upload dual-repo release publication closure index
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-dual-repo-release-publication-closure-index
          path: target/dual-repo-release-publication-closure-index
          if-no-files-found: error

