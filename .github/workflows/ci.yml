  risky-pr-golden-artifacts:
    name: Risky PR golden release support bundle artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Run Risky PR golden path
        shell: bash
        run: |
          AO2_RISKY_PR_GOLDEN_ROOT=target/risky-pr-golden-ci \
            npm run risky-pr:golden
      - name: Verify Risky PR golden support bundle artifact files
        shell: bash
        run: |
          test -f target/risky-pr-golden-ci/summary.json
          test -f target/risky-pr-golden-ci/artifact-manifest.json
          test -f target/risky-pr-golden-ci/release-support-bundle-build.json
          test -f target/risky-pr-golden-ci/release-support-bundle/release-support-bundle.json
          test -f target/risky-pr-golden-ci/release-support-bundle/SHA256SUMS
      - name: Checkout ao2-control-plane verifier
        uses: actions/checkout@v6.0.3
        with:
          repository: uesugitorachiyo/ao2-control-plane
          path: ao2-control-plane
      - name: Use matching ao2-control-plane verifier branch when present
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          head_ref="${HEAD_REF}"
          if git -C ao2-control-plane ls-remote --exit-code origin "refs/heads/${head_ref}" >/dev/null 2>&1; then
            git -C ao2-control-plane fetch --depth=1 origin "${head_ref}"
            git -C ao2-control-plane checkout --detach FETCH_HEAD
          fi
      - name: Verify release support bundle with ao2-control-plane offline verifier
        shell: bash
        run: |
          python3 ao2-control-plane/scripts/verify_release_support_bundle.py \
            --json \
            --checksums target/risky-pr-golden-ci/release-support-bundle/SHA256SUMS \
            target/risky-pr-golden-ci/release-support-bundle/release-support-bundle.json \
            > target/risky-pr-golden-ci/release-support-bundle-control-plane-verify.json
      - name: Upload Risky PR golden release support bundle artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-risky-pr-golden-release-support-bundle
          path: |
            target/risky-pr-golden-ci/summary.json
            target/risky-pr-golden-ci/artifact-manifest.json
            target/risky-pr-golden-ci/report-verify.json
            target/risky-pr-golden-ci/release-support-bundle-build.json
            target/risky-pr-golden-ci/release-support-bundle-control-plane-verify.json
            target/risky-pr-golden-ci/release-support-bundle/release-support-bundle.json
            target/risky-pr-golden-ci/release-support-bundle/SHA256SUMS
            target/risky-pr-golden-ci/cockpit/index.report.json
          if-no-files-found: error

  msrv:
    name: Rust 1.83 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: dtolnay/rust-toolchain@1.83.0
      - name: MSRV check
        run: cargo +1.83.0 check --locked --workspace --all-targets

  deny:
    name: Cargo deny (supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      # Gates the dependency graph against the checked-in deny.toml: license
      # allow-list (permissive-only, no copyleft), source allow-list
      # (crates.io only, no git deps), advisory review (the rsa Marvin-attack
      # disposition is recorded in deny.toml), and duplicate-version
      # review with unexpected warnings denied.
      - name: Deny check
        run: cargo deny check -D warnings bans licenses sources advisories
