              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_run_evidence
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_support
          - os: ubuntu-latest
            phase: test-cli-contract-support
            timeout_minutes: 15
            command: >-
              cargo test -p ao2-cli
              --test contract_gate_support_signing
              --test contract_obligation_gate_signing_survey
              --test contract_verify_obligation_gate_signing
          - os: ubuntu-latest
            phase: test-cli-release-gate-signing-sidecars
            timeout_minutes: 15
