            timeout_minutes: 20
            command: cargo build --release -p ao2-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Run ${{ matrix.phase }}
        shell: bash
        run: |
          scripts/ci-cargo-retry.sh "${{ matrix.phase }}" <<'AO2_CI_COMMAND'
          ${{ matrix.command }}
          AO2_CI_COMMAND

      - name: Upload Python guard artifacts
        if: matrix.phase == 'python-guard-tests'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-python-guard-${{ matrix.os }}
          path: target/ci-artifacts/python-guard-tests
          if-no-files-found: error

      - name: Upload ao2 binary
        if: matrix.phase == 'build-release'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-${{ matrix.os }}
          path: |
            target/release/ao2
            target/release/ao2.exe
          if-no-files-found: ignore

  non_approval_required_check_compat:
    name: Verify ${{ matrix.os }} / test-cli-non-approval
    runs-on: ${{ matrix.os }}
    needs: verify
    if: ${{ always() }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Report legacy required check compatibility
        shell: bash
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "Split non-approval shards did not pass: ${{ needs.verify.result }}"
            exit 1
          fi
          echo "Split non-approval shards passed; reporting legacy required check name."

  release-archive-hosted-smoke:
    name: Release archive hosted smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p ao2-cli

      - name: Run Unix hosted release archive smoke
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          AO2_RELEASE_HOSTED_SMOKE_ROOT: target/release-archive-hosted-smoke/${{ matrix.os }}
          AO2_RELEASE_HOSTED_SMOKE_JSON: target/release-archive-hosted-smoke/${{ matrix.os }}/summary.json
        run: scripts/release-archive-hosted-smoke.sh

      - name: Run Windows hosted release archive smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          AO2_RELEASE_HOSTED_SMOKE_ROOT: target/release-archive-hosted-smoke/${{ matrix.os }}
          AO2_RELEASE_HOSTED_SMOKE_JSON: target/release-archive-hosted-smoke/${{ matrix.os }}/summary.json
        run: ./scripts/release-archive-hosted-smoke.ps1

      - name: Upload hosted release archive smoke artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-archive-hosted-smoke-${{ matrix.os }}
          path: target/release-archive-hosted-smoke
          if-no-files-found: error

  workbench-operator-packet-control-plane-smoke:
    name: Workbench operator packet control-plane smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout AO2
        uses: actions/checkout@v6.0.3
        with:
          path: ao2

      - name: Checkout control plane
        uses: actions/checkout@v6.0.3
        with:
          repository: uesugitorachiyo/ao2-control-plane
          path: ao2-control-plane

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Run Workbench operator packet smoke
        working-directory: ao2
        env:
          AO2_CONTROL_PLANE_ROOT: ../ao2-control-plane
          AO2_WORKBENCH_OPERATOR_PACKET_CP_PROFILE: debug
        run: npm run smoke:workbench-operator-packet-control-plane

      - name: Upload Workbench operator packet smoke artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-workbench-operator-packet-control-plane-smoke-${{ matrix.os }}
          path: ao2/target/workbench-operator-packet-control-plane-smoke
          if-no-files-found: error

  workbench-operator-packet-control-plane-smoke-index:
    name: Workbench operator packet control-plane smoke index
    runs-on: ubuntu-latest
    needs: workbench-operator-packet-control-plane-smoke
    timeout-minutes: 10
    steps:
      - name: Checkout AO2
        uses: actions/checkout@v6.0.3
        with:
          path: ao2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Download Workbench operator packet smoke artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ao2-workbench-operator-packet-control-plane-smoke-*
          path: ao2/target/workbench-operator-packet-control-plane-smoke-ci-artifacts

      - name: Verify Workbench operator packet smoke index
        working-directory: ao2
        env:
          AO2_WORKBENCH_OPERATOR_PACKET_CP_INDEX_REQUIRED_OS: ubuntu-latest,macos-latest,windows-latest
        run: npm run smoke:workbench-operator-packet-control-plane:index

      - name: Upload Workbench operator packet smoke index
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-workbench-operator-packet-control-plane-smoke-index
          path: ao2/target/workbench-operator-packet-control-plane-smoke-index
          if-no-files-found: error

  release-readiness-artifacts:
    name: Release readiness artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run static release readiness
        shell: bash
        run: |
          AO2_RELEASE_READINESS_ROOT=target/release-readiness-ci \
            scripts/release-readiness.sh --static-only
      - name: Upload release-readiness artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-readiness
          path: target/release-readiness-ci
          if-no-files-found: error

  release-publication-closure-artifacts:
    name: Release publication closure artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Run release publication dry-run closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AO2_RELEASE_PUBLICATION_DRY_RUN_CLOSURE_ROOT=target/release-publication-closure-ci \
            npm run release:publication-dry-run-closure
      - name: Verify release publication closure evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/release-publication-closure-ci")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "ao2.release-publication-dry-run-closure.v1", summary
          assert summary["status"] == "passed", summary
          assert summary["publication_ready"] is True, summary
          assert summary["stable_release_ready"] is True, summary
          assert summary["publication_state"]["dry_run"] is True, summary
          assert summary["publication_state"]["upload_status"] == "not_attempted", summary
          assert summary["publication_state"]["release_publish"] == "not executed", summary
          assert summary["trust_boundary"]["mutates_releases"] is False, summary
          assert summary["trust_boundary"]["stores_credentials"] is False, summary
          PY
          test -f target/release-publication-closure-ci/summary.json
          test -f target/release-publication-closure-ci/release-asset-publication-readiness/summary.json
          test -f target/release-publication-closure-ci/release-sync-provenance-assets/summary.json
          test -f target/release-publication-closure-ci/stable-release-readiness/summary.json
      - name: Upload release publication closure evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-publication-closure
          path: target/release-publication-closure-ci
          if-no-files-found: error

  release-readiness-artifact-consumer:
    name: Release readiness artifact consumer
    runs-on: ubuntu-latest
    needs: [release-readiness-artifacts, release-train-control-plane-bridge-artifacts, ai-task-board-control-plane-bridge-artifacts, dual-repo-installed-release-smoke-artifacts, release-publication-closure-artifacts]
    timeout-minutes: 5
    steps:
      - name: Download release-readiness artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-release-readiness
          path: target/release-readiness-consumer/ao2-release-readiness
      - name: Download release train control-plane bridge artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-release-train-control-plane-bridge
          path: target/release-readiness-consumer/ao2-release-train-control-plane-bridge
      - name: Download AI task board control-plane bridge artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-ai-task-board-control-plane-bridge
          path: target/release-readiness-consumer/ao2-ai-task-board-control-plane-bridge
      - name: Download dual-repo installed release smoke artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-dual-repo-installed-release-smoke
          path: target/release-readiness-consumer/ao2-dual-repo-installed-release-smoke
      - name: Download release publication closure artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ao2-release-publication-closure
          path: target/release-readiness-consumer/ao2-release-publication-closure
      - name: Validate release-readiness artifact contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          artifact_root = Path("target/release-readiness-consumer/ao2-release-readiness")
          summary_path = artifact_root / "summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          assert summary.get('schema_version') == 'ao2.release-readiness-local.v1', summary
          assert summary.get("status") == "passed", summary
          bridge_artifact_root = Path("target/release-readiness-consumer/ao2-release-train-control-plane-bridge")
          bridge_summary_path = bridge_artifact_root / "latest" / "summary.json"
          bridge_summary = json.loads(bridge_summary_path.read_text(encoding="utf-8"))
          assert bridge_summary.get('schema_version') == 'ao2.release-train-control-plane-bridge.v1', bridge_summary
          assert bridge_summary.get("status") == "passed", bridge_summary
          assert bridge_summary.get("control_plane", {}).get("smoke") == "passed", bridge_summary
          task_board_bridge_artifact_root = Path("target/release-readiness-consumer/ao2-ai-task-board-control-plane-bridge")
          task_board_bridge_summary_path = task_board_bridge_artifact_root / "latest" / "summary.json"
          task_board_bridge_summary = json.loads(task_board_bridge_summary_path.read_text(encoding="utf-8"))
          assert task_board_bridge_summary.get('schema_version') == 'ao2.ai-task-board-control-plane-bridge.v1', task_board_bridge_summary
          assert task_board_bridge_summary.get("status") == "passed", task_board_bridge_summary
          assert task_board_bridge_summary.get("control_plane", {}).get("smoke") == "passed", task_board_bridge_summary
          task_board_smoke_path = task_board_bridge_artifact_root / "latest" / "control-plane-smoke" / "summary.json"
          task_board_smoke = json.loads(task_board_smoke_path.read_text(encoding="utf-8"))
          assert task_board_smoke.get("latest", {}).get("schema_version") == "ao2.cp-ai-task-board-readback.v1", task_board_smoke
          assert task_board_smoke.get("dashboard", {}).get("schema_version") == "ao2.cp-ai-task-board-dashboard.v1", task_board_smoke
          dual_repo_artifact_root = Path("target/release-readiness-consumer/ao2-dual-repo-installed-release-smoke")
          dual_repo_summary_path = dual_repo_artifact_root / "latest" / "summary.json"
          dual_repo_summary = json.loads(dual_repo_summary_path.read_text(encoding="utf-8"))
          assert dual_repo_summary.get('schema_version') == 'ao2.dual-repo-installed-release-smoke.v1', dual_repo_summary
          assert dual_repo_summary.get("status") == "passed", dual_repo_summary
          assert dual_repo_summary.get("archives", {}).get("ao2", {}).get("manifest_schema") == "ao2.release-manifest.v1", dual_repo_summary
          assert dual_repo_summary.get("archives", {}).get("ao2_control_plane", {}).get("manifest_schema") == "ao2-control-plane.release-manifest.v1", dual_repo_summary
          assert dual_repo_summary.get("trust_boundary", {}).get("auth_value_stored") is False, dual_repo_summary
          publication_closure_artifact_root = Path("target/release-readiness-consumer/ao2-release-publication-closure")
          publication_closure_summary_path = publication_closure_artifact_root / "summary.json"
          publication_closure_summary = json.loads(publication_closure_summary_path.read_text(encoding="utf-8"))
          assert publication_closure_summary.get('schema_version') == 'ao2.release-publication-dry-run-closure.v1', publication_closure_summary
          assert publication_closure_summary.get("status") == "passed", publication_closure_summary
          assert publication_closure_summary.get('publication_ready') is True, publication_closure_summary
          assert publication_closure_summary.get('stable_release_ready') is True, publication_closure_summary
          assert publication_closure_summary.get("publication_state", {}).get("dry_run") is True, publication_closure_summary
          assert publication_closure_summary.get("publication_state", {}).get("upload_status") == "not_attempted", publication_closure_summary
          assert publication_closure_summary.get("trust_boundary", {}).get("mutates_releases") is False, publication_closure_summary
          assert publication_closure_summary.get("trust_boundary", {}).get("stores_credentials") is False, publication_closure_summary
          checks = {item.get("name"): item for item in summary.get("checks", [])}
          required_checks = [
              "ci_job_required_os:verify",
              "ci_job_required_os:release-archive-hosted-smoke",
              "ci_job_required_os:workbench-operator-packet-control-plane-smoke",
              "ci_release_readiness_static_artifact_job",
              "ci_release_train_control_plane_bridge_artifact_job",
              "ci_ai_task_board_control_plane_bridge_artifact_job",
              "ci_dual_repo_installed_release_smoke_artifact_job",
              "ci_release_publication_closure_artifact_job",
          ]
          missing = [
              name
              for name in required_checks
              if checks.get(name, {}).get("status") != "passed"
          ]
          if missing:
              raise SystemExit(f"release-readiness artifact missing passed checks: {missing}")
          consumer_summary = {
              "schema_version": "ao2.release-readiness-artifact-consumer.v1",
              "status": "passed",
              "source_artifacts": [
                  "ao2-release-readiness",
                  "ao2-release-train-control-plane-bridge",
                  "ao2-ai-task-board-control-plane-bridge",
                  "ao2-dual-repo-installed-release-smoke",
                  "ao2-release-publication-closure",
              ],
              "source_summaries": [str(summary_path), str(bridge_summary_path), str(task_board_bridge_summary_path), str(dual_repo_summary_path), str(publication_closure_summary_path)],
              "required_checks": required_checks,
              "trust_boundary": {
                  "local_only": True,
                  "stores_credentials": False,
                  "source": "github_actions_artifact_download",
              },
          }
          out_path = Path("target/release-readiness-consumer/summary.json")
          out_path.write_text(json.dumps(consumer_summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"summary={out_path}")
          PY
      - name: Upload release-readiness consumer evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-readiness-consumer
          path: target/release-readiness-consumer
          if-no-files-found: error

  release-support-fixture-parity:
    name: Release support fixture parity with ao2-control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout AO2
        uses: actions/checkout@v6.0.3
        with:
          path: ao2
      - name: Checkout ao2-control-plane
        uses: actions/checkout@v6.0.3
        with:
          repository: uesugitorachiyo/ao2-control-plane
          path: ao2-control-plane
      - name: Use matching ao2-control-plane branch when present
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head_ref="${{ github.head_ref }}"
          if git -C ao2-control-plane ls-remote --exit-code origin "refs/heads/${head_ref}" >/dev/null 2>&1; then
            git -C ao2-control-plane fetch --depth=1 origin "${head_ref}"
            git -C ao2-control-plane checkout --detach FETCH_HEAD
          fi
      - name: Compare shared release support fixture
        shell: bash
        run: |
          mkdir -p ao2/target/release-support-fixture-parity
          cmp -s ao2/tests/fixtures/release-support-bundle-contract-v1.json ao2-control-plane/tests/fixtures/release-support-bundle-contract-v1.json
          shasum -a 256 ao2/tests/fixtures/release-support-bundle-contract-v1.json ao2-control-plane/tests/fixtures/release-support-bundle-contract-v1.json \
            | tee ao2/target/release-support-fixture-parity/SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path

          out = Path("ao2/target/release-support-fixture-parity")
          summary = {
              "schema_version": "ao2.release-support-fixture-parity.v1",
              "status": "passed",
              "producer_repo": "ao2",
              "consumer_repo": "ao2-control-plane",
              "fixture": "tests/fixtures/release-support-bundle-contract-v1.json",
              "byte_identical": True,
              "sha256s": str(out / "SHA256SUMS"),
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          test -f ao2/target/release-support-fixture-parity/summary.json
      - name: Upload release support fixture parity
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-support-fixture-parity
          path: ao2/target/release-support-fixture-parity
          if-no-files-found: error

