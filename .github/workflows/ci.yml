  rsi-cross-repo-e2e-artifacts:
    name: RSI cross-repo E2E artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Checkout ao2-control-plane
        uses: actions/checkout@v6.0.3
        with:
          repository: uesugitorachiyo/ao2-control-plane
          path: ao2-control-plane
      - name: Checkout ao-covenant
        uses: actions/checkout@v6.0.3
        with:
          repository: uesugitorachiyo/ao-covenant
          path: ao-covenant
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Go for Covenant claim gate
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: ao-covenant/go.sum
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Run RSI cross-repo E2E
        shell: bash
        run: |
          AO2_CONTROL_PLANE_REPO=ao2-control-plane \
            AO_COVENANT_REPO=ao-covenant \
            AO2_RSI_CROSS_REPO_E2E_ROOT=target/rsi-cross-repo-e2e-ci/latest \
            npm run rsi:cross-repo-e2e
      - name: Verify RSI cross-repo E2E evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/rsi-cross-repo-e2e-ci/latest")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          gate = json.loads((root / "covenant-gate" / "summary.json").read_text(encoding="utf-8"))
          blueprint = json.loads((root / "blueprint-authorization" / "summary.json").read_text(encoding="utf-8"))
          dashboard = json.loads((root / "release-readiness-dashboard-readback" / "summary.json").read_text(encoding="utf-8"))
          improvement = json.loads((root / "improvement-evidence-gate" / "summary.json").read_text(encoding="utf-8"))
          trend = json.loads((root / "improvement-trend" / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "ao2.rsi-cross-repo-e2e.v1", summary
          assert summary["status"] == "passed", summary
          assert blueprint["schema_version"] == "ao2.rsi-blueprint-authorization-gate.v1", blueprint
          assert blueprint["blueprint_authorization_ready"] is True, blueprint
          assert blueprint["authorization_scope"]["gate_model"] == "tiered", blueprint
          assert blueprint["authority_boundary"]["source"] == "ao-blueprint", blueprint
          assert blueprint["authority_boundary"]["self_authorized_by_rsi"] is False, blueprint
          assert blueprint["authority_boundary"]["authorizes_claim_publication"] is False, blueprint
          assert blueprint["authority_boundary"]["authorizes_ao_blueprint_self_change"] is False, blueprint
          assert summary["blueprint_authorization"]["schema_version"] == "ao2.rsi-blueprint-authorization-gate.v1", summary
          assert summary["blueprint_authorization"]["self_authorized_by_rsi"] is False, summary
          assert dashboard["schema_version"] == "ao2.rsi-control-plane-release-readiness-dashboard-smoke.v1", dashboard
          assert dashboard["status"] == "passed", dashboard
          assert dashboard["dashboard_link_ready"] is True, dashboard
          assert dashboard["dashboard_artifact"] == "ao2-release-readiness-consumer/dashboard.html", dashboard
          assert dashboard["claim_publish_decision"] == "deny", dashboard
          assert dashboard["claim_publish_authority"] is False, dashboard
          assert summary["release_readiness_dashboard_readback"]["dashboard_link_ready"] is True, summary
          assert summary["observed_evidence"]["release_readiness_dashboard_readback_status"] == "passed", summary
          assert summary["observed_evidence"]["release_readiness_dashboard_link_ready"] is True, summary
          assert improvement["schema_version"] == "ao2.rsi-improvement-evidence-gate.v1", improvement
          assert improvement["metric"]["measured_improvement_percent"] >= 5.0, improvement
          assert summary["improvement_evidence"]["measured_improvement_percent"] >= 5.0, summary
          assert trend["schema_version"] == "ao2.rsi-improvement-trend.v1", trend
          assert trend["trend_ready"] is True, trend
          assert trend["current_measured_improvement_percent"] >= 5.0, trend
          assert "delta_from_previous_percent" in trend, trend
          assert summary["improvement_trend"]["trend_ready"] is True, summary
          assert summary["component_summaries"]["release_readiness_dashboard_readback"].endswith("release-readiness-dashboard-readback/summary.json"), summary
          assert summary["claim_publish_decision"] == "deny", summary
          assert summary["claim_publish_authority"] is False, summary
          assert gate["schema_version"] == "covenant.rsi-claim-publish-gate.v1", gate
          assert gate["decision"] == "deny", gate
          assert gate["publish_authority"] is False, gate
          assert summary["trust_boundary"]["requires_provider_api_key"] is False, summary
          assert summary["trust_boundary"]["stores_credentials"] is False, summary
          assert summary["trust_boundary"]["publishes_claims"] is False, summary
          PY
          test -f target/rsi-cross-repo-e2e-ci/latest/live-self-change-rehearsal/summary.json
          test -f target/rsi-cross-repo-e2e-ci/latest/control-plane-readback/summary.json
          test -f target/rsi-cross-repo-e2e-ci/latest/readback-index/summary.json
          test -f target/rsi-cross-repo-e2e-ci/latest/release-readiness-dashboard-readback/summary.json
          test -f target/rsi-cross-repo-e2e-ci/latest/claim-readiness/summary.json
          test -f target/rsi-cross-repo-e2e-ci/latest/blueprint-authorization/summary.json
          test -f target/rsi-cross-repo-e2e-ci/latest/covenant-gate/summary.json
          test -f target/rsi-cross-repo-e2e-ci/latest/improvement-evidence-gate/summary.json
          test -f target/rsi-cross-repo-e2e-ci/latest/improvement-trend/summary.json
      - name: Compose RSI baseline packet
        shell: bash
        run: |
          AO2_RSI_BASELINE_PACKET_ROOT=target/rsi-baseline-packet-ci/packet \
          AO2_RSI_BASELINE_PACKET_RSI_SUMMARY=target/rsi-cross-repo-e2e-ci/latest/summary.json \
