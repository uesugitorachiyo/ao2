    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Run ${{ matrix.phase }}
        shell: bash
        run: ${{ matrix.command }}

      - name: Upload ao2 binary
        if: matrix.phase == 'build-release'
        uses: actions/upload-artifact@v4
        with:
          name: ao2-${{ matrix.os }}
          path: |
            target/release/ao2
            target/release/ao2.exe
          if-no-files-found: ignore

  deny:
    name: Cargo deny (supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      # Gates the dependency graph against the checked-in deny.toml: license
      # allow-list (permissive-only, no copyleft), source allow-list
      # (crates.io only, no git deps), advisory review (the rsa Marvin-attack
      # disposition is recorded in deny.toml), and duplicate-version
      # visibility (warn-only).
      - name: Deny check
        run: cargo deny check bans licenses sources advisories
