              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_greenfield
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_launch
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_lists
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_memory
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_obligation
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_operator
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_serve
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-project
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_workbench_project_start
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-provider
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_workbench_provider
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-queue
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_workbench_queue -- --test-threads=1
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-release-run-support
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_release
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_run_evidence
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_support
          - os: ubuntu-latest
            phase: test-cli-contract-support
            timeout_minutes: 15
            command: >-
              cargo test -p ao2-cli
              --test contract_gate_support_signing
              --test contract_obligation_gate_signing_survey
              --test contract_verify_obligation_gate_signing
          - os: ubuntu-latest
            phase: test-cli-release-gate-signing-sidecars
            timeout_minutes: 15
            command: |
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_accepts_signed
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_accepts_relocated
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_default_on
          - os: ubuntu-latest
            phase: test-cli-release-gate-signing-verified
            timeout_minutes: 15
            command: |
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_accepts_verified
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_accepts_windows
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_can_verify_hosted
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_provenance
          - os: ubuntu-latest
            phase: test-cli-release-gate-signing-rejections
            timeout_minutes: 15
            command: |
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_fails
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_requires
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_allow_unsigned
              cargo test -p ao2-cli --test release_gate_obligation_gate_signing release_gate_legacy
          - os: ubuntu-latest
            phase: test-cli-release-support
            timeout_minutes: 15
            command: >-
              cargo test -p ao2-cli
              --test cp_release_snapshot
              --test release_evaluator_decision
              --test release_handoff_checklist
              --test release_support_bundle_verification
          - os: ubuntu-latest
            phase: test-cli-release-packaging
            timeout_minutes: 20
            command: |
              npm run test:archive-resources
              cargo test -p ao2-cli --test release_packaging -- --test-threads=1
          - os: ubuntu-latest
            phase: test-cli-factory-bridge
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test factory_bridge
          - os: ubuntu-latest
            phase: test-cli-factory-cancel
            timeout_minutes: 15
            command: >-
              cargo test -p ao2-cli
              --test factory_cancel_authority
              --test factory_cancel_transition
          - os: ubuntu-latest
