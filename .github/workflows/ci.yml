    name: Workbench operator packet control-plane smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout AO2
        uses: actions/checkout@v6.0.3
        with:
          path: ao2

      - name: Checkout control plane
        uses: actions/checkout@v6.0.3
        with:
          repository: uesugitorachiyo/ao2-control-plane
          path: ao2-control-plane

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Run Workbench operator packet smoke
        working-directory: ao2
        env:
          AO2_CONTROL_PLANE_ROOT: ../ao2-control-plane
          AO2_WORKBENCH_OPERATOR_PACKET_CP_PROFILE: debug
        run: npm run smoke:workbench-operator-packet-control-plane

      - name: Upload Workbench operator packet smoke artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-workbench-operator-packet-control-plane-smoke-${{ matrix.os }}
          path: ao2/target/workbench-operator-packet-control-plane-smoke
          if-no-files-found: error

  release-readiness-artifacts:
    name: Release readiness artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run static release readiness
        shell: bash
        run: |
          AO2_RELEASE_READINESS_ROOT=target/release-readiness-ci \
            scripts/release-readiness.sh --static-only
      - name: Upload release-readiness artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-release-readiness
          path: target/release-readiness-ci
          if-no-files-found: error

  deny:
    name: Cargo deny (supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      # Gates the dependency graph against the checked-in deny.toml: license
      # allow-list (permissive-only, no copyleft), source allow-list
      # (crates.io only, no git deps), advisory review (the rsa Marvin-attack
      # disposition is recorded in deny.toml), and duplicate-version
      # visibility (warn-only).
      - name: Deny check
        run: cargo deny check bans licenses sources advisories
