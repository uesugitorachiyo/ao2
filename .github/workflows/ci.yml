name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }} / ${{ matrix.phase }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            phase: fmt
            timeout_minutes: 10
            command: cargo fmt --all -- --check
          - os: ubuntu-latest
            phase: test-workspace-non-cli
            timeout_minutes: 30
            command: cargo test --workspace --exclude ao2-cli
          - os: ubuntu-latest
            phase: test-cli-approval-core
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_approval_replay cli_adapter
              cargo test -p ao2-cli --test cli_approval_replay cli_can_pause
              cargo test -p ao2-cli --test cli_approval_replay cli_cockpit
              cargo test -p ao2-cli --test cli_approval_replay cli_contract
              cargo test -p ao2-cli --test cli_approval_replay cli_doctor
              cargo test -p ao2-cli --test cli_approval_replay cli_evidence
              cargo test -p ao2-cli --test cli_approval_replay cli_git
              cargo test -p ao2-cli --test cli_approval_replay cli_init
              cargo test -p ao2-cli --test cli_approval_replay cli_install
              cargo test -p ao2-cli --test cli_approval_replay cli_memory
              cargo test -p ao2-cli --test cli_approval_replay cli_repair
              cargo test -p ao2-cli --test cli_approval_replay cli_report
              cargo test -p ao2-cli --test cli_approval_replay cli_run
              cargo test -p ao2-cli --test cli_approval_replay cli_skill
              cargo test -p ao2-cli --test cli_approval_replay cli_template
              cargo test -p ao2-cli --test cli_approval_replay cli_upgrade
              cargo test -p ao2-cli --test cli_approval_replay cli_version
          - os: ubuntu-latest
            phase: test-cli-approval-control-plane
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_control_plane
          - os: ubuntu-latest
            phase: test-cli-approval-factory-plan
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_factory_plan
          - os: ubuntu-latest
            phase: test-cli-approval-factory-queue
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_factory_queue
          - os: ubuntu-latest
            phase: test-cli-approval-factory-project
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_factory_project
          - os: ubuntu-latest
            phase: test-cli-approval-factory-other
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_app
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_closer
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_evaluator
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_governed
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_greenfield
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_pack
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_replacement
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_run
              cargo test -p ao2-cli --test cli_approval_replay cli_factory_verify
              cargo test -p ao2-cli --test cli_approval_replay cli_greenfield
          - os: ubuntu-latest
            phase: test-cli-approval-plugin
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_plugin
          - os: ubuntu-latest
            phase: test-cli-approval-pulse-provider-release
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_approval_replay cli_pulse
              cargo test -p ao2-cli --test cli_approval_replay cli_provider
              cargo test -p ao2-cli --test cli_approval_replay cli_release
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-core
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_api
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_evidence
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_export
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_factory
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_greenfield
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_launch
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_lists
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_memory
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_obligation
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_operator
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_serve
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-project
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_workbench_project_start
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-provider
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_workbench_provider
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-queue
            timeout_minutes: 20
            command: cargo test -p ao2-cli --test cli_approval_replay cli_workbench_queue -- --test-threads=1
          - os: ubuntu-latest
            phase: test-cli-approval-workbench-release-run-support
            timeout_minutes: 20
            command: |
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_release
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_run_evidence
              cargo test -p ao2-cli --test cli_approval_replay cli_workbench_support
          - os: ubuntu-latest
            phase: test-cli-contract-support
            timeout_minutes: 15
