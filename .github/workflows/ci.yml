    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Run ${{ matrix.phase }}
        shell: bash
        run: |
          scripts/ci-cargo-retry.sh "${{ matrix.phase }}" <<'AO2_CI_COMMAND'
          ${{ matrix.command }}
          AO2_CI_COMMAND

      - name: Upload Python guard artifacts
        if: matrix.phase == 'python-guard-tests'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-python-guard-${{ matrix.os }}
          path: target/ci-artifacts/python-guard-tests
          if-no-files-found: error

      - name: Upload ao2 binary
        if: matrix.phase == 'build-release'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-${{ matrix.os }}
          path: |
            target/release/ao2
            target/release/ao2.exe
          if-no-files-found: ignore

