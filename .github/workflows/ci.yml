      - name: Run dual-repo installed release smoke
        shell: bash
        run: |
          AO2_DUAL_REPO_INSTALLED_SMOKE_ROOT=target/dual-repo-installed-release-smoke-ci \
            npm run release:dual-repo-installed-smoke -- --control-plane-root ao2-control-plane
      - name: Verify dual-repo installed release smoke evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/dual-repo-installed-release-smoke-ci/latest")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "ao2.dual-repo-installed-release-smoke.v1", summary
          assert summary["status"] == "passed", summary
          assert summary["archives"]["ao2"]["manifest_schema"] == "ao2.release-manifest.v1", summary
          assert summary["archives"]["ao2_control_plane"]["manifest_schema"] == "ao2-control-plane.release-manifest.v1", summary
          assert summary["trust_boundary"]["stores_credentials"] is False, summary
          assert summary["trust_boundary"]["auth_value_stored"] is False, summary
          readback = json.loads((root / "smoke" / "task-board-readback.json").read_text(encoding="utf-8"))
          dashboard = json.loads((root / "smoke" / "task-board-dashboard.json").read_text(encoding="utf-8"))
          assert readback["schema_version"] == "ao2.cp-ai-task-board-readback.v1", readback
          assert dashboard["schema_version"] == "ao2.cp-ai-task-board-dashboard.v1", dashboard
          PY
          test -f target/dual-repo-installed-release-smoke-ci/latest/summary.json
          test -f target/dual-repo-installed-release-smoke-ci/latest/smoke/ao2-version.json
          test -f target/dual-repo-installed-release-smoke-ci/latest/smoke/task-board.json
          test -f target/dual-repo-installed-release-smoke-ci/latest/smoke/ingest-receipt.json
          test -f target/dual-repo-installed-release-smoke-ci/latest/smoke/task-board-readback.json
          test -f target/dual-repo-installed-release-smoke-ci/latest/smoke/task-board-dashboard.json
      - name: Upload dual-repo installed release smoke evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-dual-repo-installed-release-smoke
          path: target/dual-repo-installed-release-smoke-ci
          if-no-files-found: error

  risky-pr-golden-artifacts:
    name: Risky PR golden release support bundle artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Run Risky PR golden path
        shell: bash
        run: |
          AO2_RISKY_PR_GOLDEN_ROOT=target/risky-pr-golden-ci \
            npm run risky-pr:golden
      - name: Verify Risky PR golden support bundle artifact files
        shell: bash
        run: |
          test -f target/risky-pr-golden-ci/summary.json
          test -f target/risky-pr-golden-ci/artifact-manifest.json
          test -f target/risky-pr-golden-ci/release-support-bundle-build.json
          test -f target/risky-pr-golden-ci/release-support-bundle/release-support-bundle.json
          test -f target/risky-pr-golden-ci/release-support-bundle/SHA256SUMS
      - name: Checkout ao2-control-plane verifier
        uses: actions/checkout@v6.0.3
        with:
          repository: uesugitorachiyo/ao2-control-plane
          path: ao2-control-plane
      - name: Use matching ao2-control-plane verifier branch when present
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          head_ref="${{ github.head_ref }}"
          if git -C ao2-control-plane ls-remote --exit-code origin "refs/heads/${head_ref}" >/dev/null 2>&1; then
            git -C ao2-control-plane fetch --depth=1 origin "${head_ref}"
            git -C ao2-control-plane checkout --detach FETCH_HEAD
          fi
      - name: Verify release support bundle with ao2-control-plane offline verifier
        shell: bash
        run: |
          python3 ao2-control-plane/scripts/verify_release_support_bundle.py \
            --json \
            --checksums target/risky-pr-golden-ci/release-support-bundle/SHA256SUMS \
            target/risky-pr-golden-ci/release-support-bundle/release-support-bundle.json \
            > target/risky-pr-golden-ci/release-support-bundle-control-plane-verify.json
      - name: Upload Risky PR golden release support bundle artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-risky-pr-golden-release-support-bundle
          path: |
            target/risky-pr-golden-ci/summary.json
            target/risky-pr-golden-ci/artifact-manifest.json
            target/risky-pr-golden-ci/report-verify.json
            target/risky-pr-golden-ci/release-support-bundle-build.json
            target/risky-pr-golden-ci/release-support-bundle-control-plane-verify.json
            target/risky-pr-golden-ci/release-support-bundle/release-support-bundle.json
            target/risky-pr-golden-ci/release-support-bundle/SHA256SUMS
            target/risky-pr-golden-ci/cockpit/index.report.json
          if-no-files-found: error

  deny:
    name: Cargo deny (supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      # Gates the dependency graph against the checked-in deny.toml: license
      # allow-list (permissive-only, no copyleft), source allow-list
      # (crates.io only, no git deps), advisory review (the rsa Marvin-attack
      # disposition is recorded in deny.toml), and duplicate-version
      # visibility (warn-only).
      - name: Deny check
        run: cargo deny check bans licenses sources advisories
