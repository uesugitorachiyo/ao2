name: Dual Repo Public Approval Closure

on:
  workflow_dispatch:
    inputs:
      public_release_operator_checklist_closure_run_id:
        description: "Optional AO2 Public Release Operator Checklist Closure run id."
        required: false
        type: string
      control_plane_ci_run_id:
        description: "Optional ao2-control-plane CI run id containing public pair/readback artifacts."
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  dual-repo-public-approval-closure:
    name: Dual repo public approval closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Reject provider API key environment
        shell: bash
        run: |
          if [ "${OPENAI_API_KEY+x}" = "x" ] || [ "${ANTHROPIC_API_KEY+x}" = "x" ]; then
            echo "provider API keys are not accepted by dual repo public approval closure" >&2
            exit 1
          fi
      - name: Download AO2 public release operator checklist closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_OPERATOR_CHECKLIST_CLOSURE_RUN_ID: ${{ inputs.public_release_operator_checklist_closure_run_id }}
        run: |
          set -euo pipefail
          out="target/dual-repo-public-approval-closure/ao2-public-release-operator-checklist-closure"
          rm -rf "$out"
          mkdir -p "$out"

          if [ -n "$PUBLIC_RELEASE_OPERATOR_CHECKLIST_CLOSURE_RUN_ID" ]; then
            gh run download "$PUBLIC_RELEASE_OPERATOR_CHECKLIST_CLOSURE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name ao2-public-release-operator-checklist-closure \
              --dir "$out"
            printf "%s\n" "$PUBLIC_RELEASE_OPERATOR_CHECKLIST_CLOSURE_RUN_ID" > "$out/source-run-id.txt"
            exit 0
          fi

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            rm -rf "$out"
            mkdir -p "$out"
            if gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name ao2-public-release-operator-checklist-closure \
              --dir "$out"; then
              printf "%s\n" "$run_id" > "$out/source-run-id.txt"
              exit 0
            fi
          done < <(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --branch main \
            --workflow public-release-operator-checklist-closure.yml \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId')

          echo "missing ao2-public-release-operator-checklist-closure from successful AO2 main workflow runs" >&2
          exit 1
      - name: Download control-plane public release pair verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_CI_RUN_ID: ${{ inputs.control_plane_ci_run_id }}
        run: |
          set -euo pipefail
          out="target/dual-repo-public-approval-closure/ao2-control-plane-public-release-pair-verification"
          rm -rf "$out"
          mkdir -p "$out"

          if [ -n "$CONTROL_PLANE_CI_RUN_ID" ]; then
            gh run download "$CONTROL_PLANE_CI_RUN_ID" \
              --repo uesugitorachiyo/ao2-control-plane \
              --name ao2-control-plane-public-release-pair-verification \
              --dir "$out"
            printf "%s\n" "$CONTROL_PLANE_CI_RUN_ID" > "$out/source-run-id.txt"
            exit 0
          fi

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            rm -rf "$out"
            mkdir -p "$out"
            if gh run download "$run_id" \
              --repo uesugitorachiyo/ao2-control-plane \
              --name ao2-control-plane-public-release-pair-verification \
              --dir "$out"; then
              printf "%s\n" "$run_id" > "$out/source-run-id.txt"
              exit 0
            fi
          done < <(gh run list \
            --repo uesugitorachiyo/ao2-control-plane \
            --branch main \
            --workflow CI \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId')

          echo "missing ao2-control-plane-public-release-pair-verification from successful control-plane CI runs" >&2
          exit 1
      - name: Download control-plane AO2 stable promotion evidence index readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PLANE_CI_RUN_ID: ${{ inputs.control_plane_ci_run_id }}
        run: |
          set -euo pipefail
          out="target/dual-repo-public-approval-closure/ao2-control-plane-ao2-stable-promotion-evidence-index-readback"
          rm -rf "$out"
          mkdir -p "$out"

          if [ -n "$CONTROL_PLANE_CI_RUN_ID" ]; then
            gh run download "$CONTROL_PLANE_CI_RUN_ID" \
              --repo uesugitorachiyo/ao2-control-plane \
              --name ao2-control-plane-ao2-stable-promotion-evidence-index-readback \
              --dir "$out"
            printf "%s\n" "$CONTROL_PLANE_CI_RUN_ID" > "$out/source-run-id.txt"
            exit 0
          fi

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            rm -rf "$out"
            mkdir -p "$out"
            if gh run download "$run_id" \
              --repo uesugitorachiyo/ao2-control-plane \
              --name ao2-control-plane-ao2-stable-promotion-evidence-index-readback \
              --dir "$out"; then
              printf "%s\n" "$run_id" > "$out/source-run-id.txt"
              exit 0
            fi
          done < <(gh run list \
            --repo uesugitorachiyo/ao2-control-plane \
            --branch main \
            --workflow CI \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId')

          echo "missing ao2-control-plane-ao2-stable-promotion-evidence-index-readback from successful control-plane CI runs" >&2
          exit 1
      - name: Generate dual repo public approval closure
        shell: bash
        run: |
          AO2_DUAL_REPO_PUBLIC_APPROVAL_CLOSURE_ROOT=target/dual-repo-public-approval-closure/report \
          AO2_PUBLIC_RELEASE_OPERATOR_CHECKLIST_CLOSURE_SUMMARY=target/dual-repo-public-approval-closure/ao2-public-release-operator-checklist-closure/summary.json \
          AO2_CP_PUBLIC_RELEASE_PAIR_VERIFICATION_SUMMARY=target/dual-repo-public-approval-closure/ao2-control-plane-public-release-pair-verification/summary.json \
          AO2_CP_STABLE_PROMOTION_EVIDENCE_INDEX_READBACK_SUMMARY=target/dual-repo-public-approval-closure/ao2-control-plane-ao2-stable-promotion-evidence-index-readback/summary.json \
            npm run release:dual-repo-public-approval-closure
      - name: Verify dual repo public approval closure schema
        if: always()
        shell: bash
        run: |
          python3 -c 'import json; from pathlib import Path; summary = json.loads(Path("target/dual-repo-public-approval-closure/report/summary.json").read_text(encoding="utf-8")); assert summary["schema_version"] == "ao2.dual-repo-public-approval-closure.v1", summary'
      - name: Upload dual repo public approval closure
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ao2-dual-repo-public-approval-closure
          path: target/dual-repo-public-approval-closure/report
          if-no-files-found: error
