name: Stable Promotion Dry-Run Checklist

on:
  workflow_dispatch:
    inputs:
      stable_release_evidence_run_id:
        description: "Optional successful main CI run id containing ao2-stable-release-evidence-packet."
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  stable-promotion-dry-run-checklist:
    name: Stable promotion dry-run checklist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Reject provider API key environment
        shell: bash
        run: |
          if [ "${OPENAI_API_KEY+x}" = "x" ] || [ "${ANTHROPIC_API_KEY+x}" = "x" ]; then
            echo "provider API keys are not accepted by stable promotion dry-run checklist" >&2
            exit 1
          fi
      - name: Download stable release evidence packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.stable_release_evidence_run_id }}
        run: |
          set -euo pipefail
          out="target/stable-promotion-dry-run-checklist/stable-release-evidence-packet"
          rm -rf "$out"
          mkdir -p "$out"

          if [ -n "$STABLE_RELEASE_EVIDENCE_RUN_ID" ]; then
            gh run download "$STABLE_RELEASE_EVIDENCE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name ao2-stable-release-evidence-packet \
              --dir "$out"
            exit 0
          fi

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            rm -rf "$out"
            mkdir -p "$out"
            if gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name ao2-stable-release-evidence-packet \
              --dir "$out"; then
              printf "%s\n" "$run_id" > "$out/source-run-id.txt"
              exit 0
            fi
          done < <(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --branch main \
            --workflow ci.yml \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId')

          echo "missing ao2-stable-release-evidence-packet from successful main CI runs" >&2
          exit 1
      - name: Verify stable release evidence packet
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/stable-promotion-dry-run-checklist/stable-release-evidence-packet")
          summary = json.loads((root / "packet" / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "ao2.stable-release-evidence-packet.v1", summary
          assert summary["status"] == "passed", summary
          assert summary["stable_release_evidence_ready"] is True, summary
          assert summary["operator_evidence"]["operator_release_evidence_ready"] is True, summary
          assert summary["trust_boundary"]["mutates_releases"] is False, summary
          assert summary["trust_boundary"]["stores_credentials"] is False, summary
          assert (root / "stable-promotion-workflow" / "summary.json").is_file()
          assert (root / "stable-promotion-workflow" / "post-release-verification-evidence" / "summary.json").is_file()
          assert (root / "operator-release-evidence-bundle" / "summary.json").is_file()
          assert (root / "packet" / "dashboard.html").is_file()
          PY
      - name: Run stable promotion dry-run workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY \
            AO2_STABLE_PROMOTION_ROOT=target/stable-promotion-dry-run-checklist/workflow \
            AO2_STABLE_PROMOTION_EVIDENCE_FIXTURE_DIR=target/stable-promotion-dry-run-checklist/stable-release-evidence-packet/stable-promotion-workflow/post-release-verification-evidence \
            AO2_STABLE_PROMOTION_CONFIRM="" \
            npm run release:stable-promotion-workflow
      - name: Assemble dry-run audit artifact input
        shell: bash
        run: |
          set -euo pipefail
          root="target/stable-promotion-dry-run-checklist"
          rm -rf "$root/artifact"
          mkdir -p "$root/artifact/stable-release-evidence-packet"
          cp -R "$root/workflow" "$root/artifact/workflow"
          cp -R "$root/stable-release-evidence-packet"/. "$root/artifact/stable-release-evidence-packet"/
      - name: Audit stable promotion dry-run
        shell: bash
        run: |
          AO2_STABLE_PROMOTION_DRY_RUN_ARTIFACT_ROOT=target/stable-promotion-dry-run-checklist/artifact \
          AO2_STABLE_PROMOTION_DRY_RUN_AUDIT_ROOT=target/stable-promotion-dry-run-checklist/dry-run-audit \
            npm run release:stable-promotion-dry-run-audit
      - name: Generate operator checklist
        shell: bash
        run: |
          AO2_STABLE_PROMOTION_DRY_RUN_AUDIT_SUMMARY=target/stable-promotion-dry-run-checklist/dry-run-audit/summary.json \
          AO2_STABLE_PROMOTION_OPERATOR_CHECKLIST_ROOT=target/stable-promotion-dry-run-checklist/operator-checklist \
            npm run release:stable-promotion-operator-checklist
      - name: Verify dry-run checklist evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/stable-promotion-dry-run-checklist")
          audit = json.loads((root / "dry-run-audit" / "summary.json").read_text(encoding="utf-8"))
          checklist = json.loads((root / "operator-checklist" / "summary.json").read_text(encoding="utf-8"))
          assert audit["schema_version"] == "ao2.stable-promotion-dry-run-audit.v1", audit
          assert audit["status"] == "passed", audit
          assert audit["dry_run_audit_ready"] is True, audit
          assert audit["workflow"]["promotion_status"] == "not_attempted", audit
          assert audit["evidence_gate"]["passed_check_count"] == audit["evidence_gate"]["check_count"], audit
          assert checklist["schema_version"] == "ao2.stable-promotion-operator-checklist.v1", checklist
          assert checklist["status"] == "passed", checklist
          assert checklist["operator_checklist_ready"] is True, checklist
          assert checklist["operator_decision"]["confirmation_entered"] is False, checklist
          assert checklist["trust_boundary"]["mutates_releases"] is False, checklist
          assert checklist["trust_boundary"]["stores_credentials"] is False, checklist
          assert (root / "operator-checklist" / "checklist.md").is_file()
          PY
      - name: Upload stable promotion dry-run checklist
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ao2-stable-promotion-dry-run-checklist
          path: target/stable-promotion-dry-run-checklist
          if-no-files-found: error
