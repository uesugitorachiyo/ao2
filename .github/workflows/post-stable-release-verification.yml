name: Post Stable Release Verification

on:
  workflow_dispatch:
    inputs:
      ao2_release_tag:
        description: "AO2 release tag to verify. Defaults to the stable release-train manifest when omitted."
        required: false
        type: string
      ao2_release_version:
        description: "AO2 release version used in archive names. Defaults to the stable release-train manifest when omitted."
        required: false
        type: string
      ao2_cp_release_tag:
        description: "ao2-control-plane release tag used by the dual public smoke. Defaults to the stable release-train manifest when omitted."
        required: false
        type: string
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

concurrency:
  group: post-stable-release-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  AO2_RELEASE_REPO: uesugitorachiyo/ao2
  AO2_RELEASE_TAG: ${{ inputs.ao2_release_tag }}
  AO2_RELEASE_VERSION: ${{ inputs.ao2_release_version }}
  AO2_CP_RELEASE_TAG: ${{ inputs.ao2_cp_release_tag }}

jobs:
  post-stable-release-smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu stable release smoke
            os: ubuntu-latest
            target_label: linux-x86_64
            binary: ao2
            shell: bash
          - label: macOS stable release smoke
            os: macos-14
            target_label: macos-aarch64
            binary: ao2
            shell: bash
          - label: Windows stable release smoke
            os: windows-latest
            target_label: windows-x86_64
            binary: ao2.exe
            shell: pwsh

    steps:
      - name: Checkout smoke helpers
        uses: actions/checkout@v6.0.3

      - name: Resolve stable release train defaults
        shell: bash
        run: |
          set -euo pipefail
          eval "$(scripts/release-train-env.sh stable)"
          {
            echo "AO2_RELEASE_TAG=${AO2_RELEASE_TAG:-$AO2_RELEASE_TRAIN_AO2_TAG}"
            echo "AO2_RELEASE_VERSION=${AO2_RELEASE_VERSION:-$AO2_RELEASE_TRAIN_AO2_VERSION}"
            echo "AO2_CP_RELEASE_TAG=${AO2_CP_RELEASE_TAG:-$AO2_RELEASE_TRAIN_CP_TAG}"
          } >> "$GITHUB_ENV"

      - name: Download stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          AO2_TARGET_LABEL: ${{ matrix.target_label }}
        run: |
          set -euo pipefail
          AO2_ASSET="ao2-${AO2_RELEASE_VERSION}-${AO2_TARGET_LABEL}.tar.gz"
          mkdir -p release smoke/extract smoke/bin
          gh release download "$AO2_RELEASE_TAG" \
            --repo "$AO2_RELEASE_REPO" \
            --pattern "$AO2_ASSET" \
            --pattern SHA256SUMS \
            --dir release \
            --clobber
        shell: bash

      - name: Verify and install stable release on Unix
        if: matrix.shell == 'bash'
        env:
          AO2_TARGET_LABEL: ${{ matrix.target_label }}
          AO2_BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          AO2_ASSET="ao2-${AO2_RELEASE_VERSION}-${AO2_TARGET_LABEL}.tar.gz"
          (cd release && grep "  $AO2_ASSET$" SHA256SUMS > SHA256SUMS.asset)
          (cd release && shasum -a 256 -c SHA256SUMS.asset)
          tar -xzf "release/$AO2_ASSET" -C smoke/extract
          test -f smoke/extract/RELEASE-MANIFEST.json
          sh smoke/extract/verify-release.sh | tee smoke/archive-verification.txt
          AO2_INSTALL_DIR="$PWD/smoke/bin" \
            sh smoke/extract/install.sh | tee smoke/install-output.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("smoke/bin/ao2.install-verification.json").read_text(encoding="utf-8")
          )
          assert evidence["status"] == "verified", evidence
          assert evidence["install_status"] == "installed", evidence
          assert evidence["version"] == Path("smoke/extract/VERSION").read_text(encoding="utf-8").strip(), evidence
          PY
          test -x "smoke/bin/$AO2_BINARY"
          "smoke/bin/$AO2_BINARY" version --json | tee smoke/version.json
          "smoke/bin/$AO2_BINARY" doctor --json | tee smoke/doctor.json
          "smoke/bin/$AO2_BINARY" adapter doctor --provider scripted | tee smoke/scripted-doctor.txt
        shell: bash

      - name: Verify and install stable release on Windows
        if: matrix.shell == 'pwsh'
        env:
          AO2_TARGET_LABEL: ${{ matrix.target_label }}
          AO2_BINARY: ${{ matrix.binary }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:AO2_ASSET = "ao2-$env:AO2_RELEASE_VERSION-$env:AO2_TARGET_LABEL.tar.gz"
          $manifestLine = Select-String -Path release/SHA256SUMS -Pattern "  $([Regex]::Escape($env:AO2_ASSET))$" | Select-Object -First 1
          if (-not $manifestLine) {
            throw "missing checksum entry for $env:AO2_ASSET"
          }
          $expected = ($manifestLine.Line -split "\s+")[0].ToLowerInvariant()
          $observed = (Get-FileHash -Algorithm SHA256 (Join-Path "release" $env:AO2_ASSET)).Hash.ToLowerInvariant()
          if ($expected -ne $observed) {
            throw "checksum mismatch for $env:AO2_ASSET expected=$expected observed=$observed"
          }
          tar -xzf (Join-Path "release" $env:AO2_ASSET) -C smoke/extract
          if (!(Test-Path smoke/extract/RELEASE-MANIFEST.json)) {
            throw "missing RELEASE-MANIFEST.json"
          }
          & smoke/extract/Verify-Release.ps1 |
            Set-Content -Encoding UTF8 smoke/archive-verification.txt
          $env:AO2_INSTALL_DIR = (Resolve-Path smoke/bin).Path
          & smoke/extract/install.ps1 |
            Set-Content -Encoding UTF8 smoke/install-output.txt
          $installEvidencePath = Join-Path $env:AO2_INSTALL_DIR "ao2.exe.install-verification.json"
          if (!(Test-Path $installEvidencePath)) {
            throw "missing install verification evidence: $installEvidencePath"
          }
          $installEvidence = Get-Content $installEvidencePath -Raw | ConvertFrom-Json
          if ($installEvidence.status -ne "verified") {
            throw "install evidence status is not verified"
          }
          if ($installEvidence.install_status -ne "installed") {
            throw "install evidence status is not installed"
          }
          $ao2 = Join-Path $env:AO2_INSTALL_DIR $env:AO2_BINARY
          if (!(Test-Path $ao2)) {
            throw "installed binary missing: $ao2"
          }
          & $ao2 version --json | Set-Content -Encoding UTF8 smoke/version.json
          & $ao2 doctor --json | Set-Content -Encoding UTF8 smoke/doctor.json
          & $ao2 adapter doctor --provider scripted | Set-Content -Encoding UTF8 smoke/scripted-doctor.txt
        shell: pwsh

      - name: Upload post stable release smoke evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: post-stable-release-smoke-${{ runner.os }}
          path: |
            release/SHA256SUMS
            smoke/archive-verification.txt
            smoke/install-output.txt
            smoke/bin/ao2*.install-verification.json
            smoke/version.json
            smoke/doctor.json
            smoke/scripted-doctor.txt
          if-no-files-found: error

  dual-public-release-smoke:
    name: Dual public release smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smoke helpers
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Run dual public release smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AO2_PUBLIC_RELEASE_SMOKE_ROOT=target/dual-public-release-smoke \
            npm run release:dual-public-smoke

      - name: Validate dual public release smoke evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/dual-public-release-smoke/latest")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "ao2.dual-public-release-smoke.v1", summary
          assert summary["status"] == "passed", summary
          assert summary["release_pair"]["ao2"]["repo"] == "uesugitorachiyo/ao2", summary
          assert summary["release_pair"]["ao2_control_plane"]["repo"] == "uesugitorachiyo/ao2-control-plane", summary
          assert summary["archives"]["ao2"]["manifest_schema"] == "ao2.release-manifest.v1", summary
          assert summary["archives"]["ao2_control_plane"]["manifest_schema"] == "ao2-control-plane.release-manifest.v1", summary
          trust_boundary = summary["trust_boundary"]
          assert trust_boundary["downloads_public_release_archives"] is True, summary
          assert trust_boundary["auth_value_stored"] is False, summary
          assert trust_boundary["credential_material_included"] is False, summary
          assert trust_boundary["mutates_github_releases"] is False, summary
          assert trust_boundary["control_plane_approves_release"] is False, summary
          readback = json.loads((root / "smoke" / "task-board-readback.json").read_text(encoding="utf-8"))
          dashboard = json.loads((root / "smoke" / "task-board-dashboard.json").read_text(encoding="utf-8"))
          assert readback["schema_version"] == "ao2.cp-ai-task-board-readback.v1", readback
          assert dashboard["schema_version"] == "ao2.cp-ai-task-board-dashboard.v1", dashboard
          PY
          test -f target/dual-public-release-smoke/latest/summary.json
          test -f target/dual-public-release-smoke/latest/smoke/ao2-version.json
          test -f target/dual-public-release-smoke/latest/smoke/task-board.json
          test -f target/dual-public-release-smoke/latest/smoke/ingest-receipt.json
          test -f target/dual-public-release-smoke/latest/smoke/task-board-readback.json
          test -f target/dual-public-release-smoke/latest/smoke/task-board-dashboard.json

      - name: Upload dual public release smoke evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ao2-dual-public-release-smoke
          path: target/dual-public-release-smoke
          if-no-files-found: error
