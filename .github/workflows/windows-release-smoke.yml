name: Windows Release Smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "AO2 release tag to smoke on Windows. Defaults to the stable release-train manifest when omitted."
        required: false
        type: string
      release_version:
        description: "AO2 release version used in the Windows archive name. Defaults to the stable release-train manifest when omitted."
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Native Windows release smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Resolve stable release train defaults
        shell: bash
        env:
          AO2_RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          AO2_RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          eval "$(scripts/release-train-env.sh stable)"
          {
            echo "AO2_RELEASE_TAG=${AO2_RELEASE_TAG_INPUT:-$AO2_RELEASE_TRAIN_AO2_TAG}"
            echo "AO2_RELEASE_VERSION=${AO2_RELEASE_VERSION_INPUT:-$AO2_RELEASE_TRAIN_AO2_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Download public release archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          $archive = "ao2-$env:AO2_RELEASE_VERSION-windows-x86_64.tar.gz"
          gh release download $env:AO2_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $archive `
            --pattern "SHA256SUMS" `
            --dir dist-windows

      - name: Verify public release archive checksum
        shell: pwsh
        run: |
          $archive = "ao2-$env:AO2_RELEASE_VERSION-windows-x86_64.tar.gz"
          $expected = Select-String -Path dist-windows/SHA256SUMS -Pattern $archive |
            ForEach-Object { ($_ -split "\s+")[0] } |
            Select-Object -First 1
          if (-not $expected) {
            throw "Missing checksum entry for $archive"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -Path "dist-windows/$archive").Hash.ToLowerInvariant()
          if ($actual -ne $expected.ToLowerInvariant()) {
            throw "Archive checksum mismatch for $archive"
          }

      - name: Smoke installed release
        shell: pwsh
        run: |
          $archive = "ao2-$env:AO2_RELEASE_VERSION-windows-x86_64.tar.gz"
          ./scripts/smoke-windows-release.ps1 `
            -Archive (Join-Path "dist-windows" $archive) `
            -SmokeRoot "$env:RUNNER_TEMP/ao2-windows-release-smoke"
