name: Operator Readiness Summary

on:
  workflow_dispatch:
    inputs:
      final_closure_run_id:
        description: "Optional successful main CI run id containing ao2-release-readiness-final-closure-verifier."
        required: false
        type: string
      stable_promotion_evidence_index_run_id:
        description: "Optional Stable Promotion Evidence Index run id containing ao2-stable-promotion-evidence-index."
        required: false
        type: string
      public_pair_digest_audit_run_id:
        description: "Optional Post Release Pair Digest Audit run id containing ao2-public-release-pair-digest-audit."
        required: false
        type: string
      artifact_size_budget_audit_run_id:
        description: "Optional Release Artifact Size Budget Audit run id containing ao2-release-artifact-size-budget-audit."
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  operator-readiness-summary:
    name: Operator readiness summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Reject provider API key environment
        shell: bash
        run: |
          if [ "${OPENAI_API_KEY+x}" = "x" ] || [ "${ANTHROPIC_API_KEY+x}" = "x" ]; then
            echo "provider API keys are not accepted by operator readiness summary" >&2
            exit 1
          fi
      - name: Download operator readiness source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_CLOSURE_RUN_ID: ${{ inputs.final_closure_run_id }}
          STABLE_PROMOTION_EVIDENCE_INDEX_RUN_ID: ${{ inputs.stable_promotion_evidence_index_run_id }}
          PUBLIC_PAIR_DIGEST_AUDIT_RUN_ID: ${{ inputs.public_pair_digest_audit_run_id }}
          ARTIFACT_SIZE_BUDGET_AUDIT_RUN_ID: ${{ inputs.artifact_size_budget_audit_run_id }}
        run: |
          set -euo pipefail

          download_artifact() {
            local artifact_name="$1"
            local out="$2"
            local explicit_run_id="$3"
            local workflow="$4"

            rm -rf "$out"
            mkdir -p "$out"

            if [ -n "$explicit_run_id" ]; then
              gh run download "$explicit_run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" \
                --dir "$out"
              printf "%s\n" "$explicit_run_id" > "$out/source-run-id.txt"
              return 0
            fi

            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              rm -rf "$out"
              mkdir -p "$out"
              if gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" \
                --dir "$out"; then
                printf "%s\n" "$run_id" > "$out/source-run-id.txt"
                return 0
              fi
            done < <(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --branch main \
              --workflow "$workflow" \
              --status success \
              --limit 10 \
              --json databaseId \
              --jq '.[].databaseId')

            echo "missing $artifact_name from successful main workflow runs" >&2
            return 1
          }

          download_artifact \
            ao2-release-readiness-final-closure-verifier \
            target/operator-readiness-summary/final-closure \
            "$FINAL_CLOSURE_RUN_ID" \
            ci.yml

          download_artifact \
            ao2-stable-promotion-evidence-index \
            target/operator-readiness-summary/stable-promotion-evidence-index \
            "$STABLE_PROMOTION_EVIDENCE_INDEX_RUN_ID" \
            stable-promotion-evidence-index.yml

          download_artifact \
            ao2-public-release-pair-digest-audit \
            target/operator-readiness-summary/public-pair-digest-audit \
            "$PUBLIC_PAIR_DIGEST_AUDIT_RUN_ID" \
            post-release-pair-digest-audit.yml

          download_artifact \
            ao2-release-artifact-size-budget-audit \
            target/operator-readiness-summary/artifact-size-budget-audit \
            "$ARTIFACT_SIZE_BUDGET_AUDIT_RUN_ID" \
            release-artifact-size-budget-audit.yml
      - name: Generate operator readiness summary
        shell: bash
        run: |
          AO2_OPERATOR_READINESS_SUMMARY_ROOT=target/operator-readiness-summary/report \
          AO2_OPERATOR_READINESS_FINAL_CLOSURE_ROOT=target/operator-readiness-summary/final-closure \
          AO2_OPERATOR_READINESS_STABLE_PROMOTION_INDEX_ROOT=target/operator-readiness-summary/stable-promotion-evidence-index \
          AO2_OPERATOR_READINESS_PUBLIC_PAIR_DIGEST_ROOT=target/operator-readiness-summary/public-pair-digest-audit \
          AO2_OPERATOR_READINESS_ARTIFACT_SIZE_BUDGET_ROOT=target/operator-readiness-summary/artifact-size-budget-audit \
            npm run release:operator-readiness-summary
      - name: Verify operator readiness summary schema
        if: always()
        shell: bash
        run: |
          python3 -c 'import json; from pathlib import Path; summary = json.loads(Path("target/operator-readiness-summary/report/summary.json").read_text(encoding="utf-8")); assert summary["schema_version"] == "ao2.operator-readiness-summary.v1", summary'
      - name: Upload operator readiness summary
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ao2-operator-readiness-summary
          path: target/operator-readiness-summary/report
          if-no-files-found: error
