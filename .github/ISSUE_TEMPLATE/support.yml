name: Support question
description: Ask for help using AO2 v0.5.2.
title: "[Support]: "
labels: ["support", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Public issues are not a place for secrets, provider credentials, or private evidence. Use `docs/SUPPORT-REPRODUCTION.md` as the public-safe checklist before filing.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - First 30 minutes guide
        - Install or update
        - Rollback or uninstall
        - Approval behavior
        - Manifest or checksum verification
        - Offline verification
        - Control Plane compatibility
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AO2 version
      placeholder: "0.5.2"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Include OS and CPU architecture.
      placeholder: "macOS arm64, Ubuntu x86_64, Windows x86_64"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to do and where you are stuck.
    validations:
      required: true
  - type: input
    id: verification
    attributes:
      label: Verification state
      description: Note whether checksum, manifest, or offline verification passed, failed, or was not run.
      placeholder: "SHA256SUMS passed; verify-release.sh passed"
  - type: input
    id: failure_category
    attributes:
      label: Failure category
      description: For approval/replay or manifest issues, include the AO2 category if shown.
      placeholder: "approval_status=pending; replay_state=waiting_for_approval; manifest mismatch: hash mismatch"
  - type: textarea
    id: context
    attributes:
      label: Redacted context
      description: Include command, expected result, actual result, relevant evidence path, action digest or manifest SHA-256 when public-safe, verifier command, and sanitized logs when relevant. Do not paste secrets, provider secrets, private repository contents, private logs, or private credentials.
